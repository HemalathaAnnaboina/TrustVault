spring.application.name=trustvault-backend
server.port=8080

# PostgreSQL 17 Relational Database Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/trustvault_db}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.postgresql.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Flyway Database Migrations
spring.flyway.enabled=${SPRING_FLYWAY_ENABLED:true}
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# File Upload Limits
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# TrustVault Security Configuration
trustvault.jwt.secret=${TRUSTVAULT_JWT_SECRET}
trustvault.jwt.expiration-ms=${TRUSTVAULT_JWT_EXPIRATION_MS:86400000}
trustvault.storage.path=${TRUSTVAULT_STORAGE_PATH:./data/vault}
trustvault.storage.max-file-size=${TRUSTVAULT_STORAGE_MAX_FILE_SIZE:52428800}
trustvault.download-token.expiration-seconds=${TRUSTVAULT_DOWNLOAD_TOKEN_EXPIRATION_SECONDS:60}

# Rate Limiting: 10 login attempts per minute per IP
trustvault.rate-limit.login-per-minute=${TRUSTVAULT_RATE_LIMIT_LOGIN_PER_MINUTE:10}

# Renewal Extension Limits: Maximum 365 days
trustvault.renewal.max-extension-days=${TRUSTVAULT_RENEWAL_MAX_EXTENSION_DAYS:365}
