spring.application.name=trustvault-backend-test

# In-memory H2 database for isolated testing
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Flyway disabled for unit/mockMvc test environment
spring.flyway.enabled=false

# TrustVault Security Configuration for tests
trustvault.jwt.secret=TrustVaultSuperSecureKeyMustBeAtLeast256BitsLongForHMACSHA256Signature123456789!
trustvault.jwt.expiration-ms=86400000
trustvault.storage.path=./data/vault_test
trustvault.storage.max-file-size=52428800
trustvault.download-token.expiration-seconds=60
trustvault.rate-limit.login-per-minute=10000
trustvault.renewal.max-extension-days=365
